<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin login | Gadget Hub</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/hero.css">
  <link rel="stylesheet" href="../../css/footer.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/account.css">
</head>
<body class="admin-auth-page" data-root="../../">
  <main class="login-modal-layer admin-login-layer">
    <section class="admin-login-panel" aria-labelledby="admin-login-title">
      <header class="admin-login-brand" aria-label="Gadget Hub admin access">
        <span class="auth-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M13.6 1.8 4.8 13h5.8l-.7 9.2L19.2 10h-5.8l.2-8.2Z"/></svg>
        </span>
        <div>
          <p class="admin-brand-name">GADGET <span>HUB</span></p>
          <small>ADMIN PORTAL</small>
        </div>
      </header>

      <form class="admin-login-form" id="f">
        <h1 id="admin-login-title">Admin sign in</h1>
        <p class="muted admin-login-subtitle">Welcome back. Sign in to continue.</p>

        <div class="field">
          <label for="admin-email">Email</label>
          <input id="admin-email" name="email" type="email" required autocomplete="email" autofocus>
          <div class="field-error" data-error="email"></div>
        </div>

        <div class="field">
          <label for="admin-password">Password</label>
          <div class="password-input">
            <input id="admin-password" name="password" type="password" required autocomplete="current-password">
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="admin-password" data-toggle-password>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="field-error" data-error="password"></div>
        </div>

        <button class="btn primary" type="submit">Sign in</button>
      </form>
    </section>
  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/admin/login.js"></script>
</body>
</html>
