<body class="admin-page" data-root="../../" data-admin-page="coupons"><div class="admin">
  <aside class="sidebar"><a class="admin-brand" href="../../index.html"><span class="admin-brand-mark">G</span><span>Gadget Hub<small>STORE ADMIN</small></span></a><p class="admin-nav-label">WORKSPACE</p><nav class="admin-nav" aria-label="Admin pages"><a href="dashboard.html"><span class="nav-icon">⌂</span>Overview</a><a href="products.html"><span class="nav-icon">▣</span>Products</a><a href="categories.html"><span class="nav-icon">▦</span>Categories</a><a href="orders.html"><span class="nav-icon">▤</span>Orders</a><a href="customers.html"><span class="nav-icon">♙</span>Customers</a><a class="is-active" href="coupons.html"><span class="nav-icon">％</span>Coupons</a><a href="reviews.html"><span class="nav-icon">☆</span>Reviews</a><a href="payments.html"><span class="nav-icon">＄</span>Payments</a></nav><div class="sidebar-bottom"><a class="storefront-link" href="../../index.html">View storefront <span>↗</span></a><button id="out" class="admin-logout" type="button">Log out</button></div></aside>
  <main class="admin-main"><header class="admin-heading"><div><p class="admin-eyebrow">PROMOTIONS</p><h1>Coupons</h1><p class="admin-subtitle">Create discounts and manage active promotion codes.</p></div><button id="refresh-dashboard" class="btn ghost" type="button">Refresh data</button></header><p id="admin-message" class="admin-message" role="status" aria-live="polite"></p>
    <section class="admin-section"><form class="card admin-form admin-inline-form" id="coupon-form"><h2>Create a coupon</h2><label>Code<input name="code" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_-]+"></label><label>Discount type<select name="discountType"><option value="PERCENTAGE">Percentage</option><option value="FIXED">Fixed amount (NGN)</option></select></label><label>Discount value<input name="discountValue" type="number" min="0.01" step="0.01" required></label><label>Minimum order (NGN)<input name="minimumAmount" type="number" min="0" step="0.01" value="0"></label><button class="btn primary" type="submit">Create coupon</button></form></section>
    <section class="admin-section"><div class="admin-section-heading"><div><p class="admin-eyebrow">PROMOTIONS</p><h2>All coupons</h2></div></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Code</th><th>Discount</th><th>Uses</th><th>Status</th><th>Actions</th></tr></thead><tbody id="coupon-rows"><tr><td colspan="5">Loading coupons...</td></tr></tbody></table></div></section></main>
  </div><div id="toasts" aria-live="polite"></div><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/utils.js"></script><script src="../../js/auth.js"></script><script src="../../js/admin/dashboard.js"></script></body></html>
