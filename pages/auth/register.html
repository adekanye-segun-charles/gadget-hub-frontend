<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register | Gadget Hub</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/hero.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/account.css">
</head>
<body class="auth-page" data-root="../../">
  <div id="navbar"></div>
  <main class="login-modal-layer register-modal-layer">
    <section class="login-modal register-modal" role="dialog" aria-modal="true" aria-labelledby="register-title">
      <a class="login-modal-close" href="../../index.html" aria-label="Close registration and return to the home page">&times;</a>
      <header class="auth-brand" aria-label="Gadget Hub">
        <span class="auth-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M13.6 1.8 4.8 13h5.8l-.7 9.2L19.2 10h-5.8l.2-8.2Z"/></svg>
        </span>
        <span class="auth-brand-name">GADGET <b>HUB</b></span>
        <small>TECH FOR EVERY DAY</small>
      </header>
      <form class="form-card" id="f">
      <h1 id="register-title">Create your account</h1>
      <p class="muted auth-intro">A few details and you’re ready to shop.</p>
      <div class="field">
        <label for="register-first-name">First name</label>
        <input id="register-first-name" name="firstName" autocomplete="given-name" minlength="2" maxlength="50" required>
        <div class="field-error" data-error="firstName"></div>
      </div>
      <div class="field">
        <label for="register-last-name">Last name</label>
        <input id="register-last-name" name="lastName" autocomplete="family-name" minlength="2" maxlength="50" required>
        <div class="field-error" data-error="lastName"></div>
      </div>
      <div class="field">
        <label for="register-email">Email</label>
        <input id="register-email" name="email" type="email" autocomplete="email" required>
        <div class="field-error" data-error="email"></div>
      </div>
      <div class="field">
        <label for="register-phone">Phone</label>
        <input id="register-phone" name="phone" type="tel" autocomplete="tel" minlength="7" maxlength="20" required>
        <div class="field-error" data-error="phone"></div>
      </div>
      <div class="field">
        <label for="register-password">Password</label>
        <div class="password-input">
          <input id="register-password" name="password" type="password" minlength="8" maxlength="100" autocomplete="new-password" required>
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="register-password" data-toggle-password>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="password-strength" role="progressbar" aria-label="Password strength" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" aria-valuetext="No password entered" data-strength="0">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="password-strength-label" aria-live="polite">Use at least 8 characters for a stronger password.</p>
        <div class="field-error" data-error="password"></div>
      </div>
      <div class="field">
        <label for="register-confirm">Confirm password</label>
        <div class="password-input">
          <input id="register-confirm" name="confirm" type="password" maxlength="100" autocomplete="new-password" required>
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="register-confirm" data-toggle-password>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn primary" type="submit">Create account</button>
      <p class="muted auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </section>
  </main>
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/auth-pages.js"></script>
</body>
</html>
