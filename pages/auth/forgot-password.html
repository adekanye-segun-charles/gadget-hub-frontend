<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot password | Gadget Hub</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/account.css">
</head>
<body class="auth-page" data-root="../../">
  <div id="navbar"></div>
  <main class="login-modal-layer">
    <section class="login-modal" role="dialog" aria-modal="true" aria-labelledby="forgot-title">
      <a class="login-modal-close" href="login.html" aria-label="Return to login">&times;</a>
      <header class="auth-brand" aria-label="Gadget Hub">
        <span class="auth-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13.6 1.8 4.8 13h5.8l-.7 9.2L19.2 10h-5.8l.2-8.2Z"/></svg></span>
        <span class="auth-brand-name">GADGET <b>HUB</b></span>
        <small>TECH FOR EVERY DAY</small>
      </header>
      <form class="form-card" id="forgot-password-form">
        <h1 id="forgot-title">Forgot your password?</h1>
        <p class="muted auth-intro">Enter the email address on your account and we’ll send you a secure reset link.</p>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input id="forgot-email" name="email" type="email" required autocomplete="email" autofocus>
          <div class="field-error" data-error="email"></div>
        </div>
        <button class="btn primary" type="submit">Verify email</button>
        <p class="recovery-status" id="forgot-status" role="status" aria-live="polite"></p>
        <p class="muted auth-switch"><a href="login.html">Back to login</a></p>
      </form>
    </section>
  </main>
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/password-recovery.js"></script>
</body>
</html>
