<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password | Gadget Hub</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/account.css">
</head>
<body class="auth-page" data-root="../../">
  <div id="navbar"></div>
  <main class="login-modal-layer">
    <section class="login-modal" role="dialog" aria-modal="true" aria-labelledby="reset-title">
      <a class="login-modal-close" href="login.html" aria-label="Return to login">&times;</a>
      <header class="auth-brand" aria-label="Gadget Hub">
        <span class="auth-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13.6 1.8 4.8 13h5.8l-.7 9.2L19.2 10h-5.8l.2-8.2Z"/></svg></span>
        <span class="auth-brand-name">GADGET <b>HUB</b></span>
        <small>TECH FOR EVERY DAY</small>
      </header>
      <form class="form-card" id="reset-password-form">
        <h1 id="reset-title">Choose a new password</h1>
        <p class="muted auth-intro">Create a new password for your account.</p>
        <input id="reset-token" name="token" type="hidden">
        <div class="field">
          <label for="reset-password">New password</label>
          <div class="password-input">
            <input id="reset-password" name="newPassword" type="password" minlength="8" maxlength="100" required autocomplete="new-password">
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="reset-password" data-toggle-password>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="field-error" data-error="newPassword"></div>
        </div>
        <div class="field">
          <label for="reset-confirm-password">Confirm new password</label>
          <div class="password-input">
            <input id="reset-confirm-password" name="confirmPassword" type="password" maxlength="100" required autocomplete="new-password">
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="reset-confirm-password" data-toggle-password>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="btn primary" type="submit">Reset password</button>
        <p class="recovery-status" id="reset-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/password-recovery.js"></script>
</body>
</html>
