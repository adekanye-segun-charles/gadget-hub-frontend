<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My account | Gadget Hub</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/hero.css">
  <link rel="stylesheet" href="../../css/footer.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/account.css">
</head>
<body class="account-page" data-root="../../">
  <div id="navbar"></div>
  <main class="container section account-dashboard">
    <div class="account-header">
      <div>
        <span class="account-kicker">Your profile</span>
        <h1>My account</h1>
      </div>
      <button class="btn ghost" id="logout" type="button">Log out</button>
    </div>
    <p class="account-intro">Manage and update your personal details.</p>
    <div class="account-cards">
      <form class="form-card" id="profile-form">
        <h2>Profile details</h2>
        <div class="field"><label for="firstName">First name</label><input id="firstName" name="firstName" required minlength="2" maxlength="50" autocomplete="given-name"></div>
        <div class="field"><label for="lastName">Last name</label><input id="lastName" name="lastName" required minlength="2" maxlength="50" autocomplete="family-name"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" readonly autocomplete="email"></div>
        <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" maxlength="20" autocomplete="tel"></div>
        <button class="btn primary" type="submit">Save profile</button>
      </form>
    </div>
  </main>
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/account/profile.js"></script>
</body>
</html>
